version: '3.8'

services:
  # Service 1: Database PostgreSQL
  db_weather:
    image: postgres:15
    container_name: weather_postgres_container
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: weather_db
    ports:
      - "5433:5432" # Kita gunakan port 5433 agar tidak bentrok dengan Postgres lokalmu

  # Service 2: Alat Visual untuk melihat tabel (Optional tapi sangat membantu)
  pgadmin:
    image: dpage/pgadmin4
    container_name: weather_pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"