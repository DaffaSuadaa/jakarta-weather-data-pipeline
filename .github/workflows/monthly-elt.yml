name: Daily Weather ETL

# Menentukan kapan automation ini berjalan
on:
  schedule:
    # Berjalan setiap hari jam 00:00 UTC (Jam 07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Tombol manual untuk mengetes kapan saja

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute ETL Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py